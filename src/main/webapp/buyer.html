<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yoharshini Mart - Buyer</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7f6;
        }

        .buyer-header {
            background: #173c33;
            color: white;
            padding: 18px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .buyer-header h2 {
            margin: 0;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        .search-box input {
            width: 300px;
            padding: 10px;
            border-radius: 6px;
            border: none;
        }

        .search-box button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .categories {
            padding: 20px;
            text-align: center;
        }

        .categories button {
            margin: 5px;
            padding: 10px 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: #d9e9d9;
        }

        .products {
            padding: 20px;
        }

        #productList {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .product-card h3 {
            margin-top: 0;
        }

        .product-card button {
            background: #173c33;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header class="buyer-header">

    <h2>🛍️ Yoharshini Mart</h2>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
            onkeyup="searchProducts()"
        >

        <button onclick="searchProducts()">Search</button>
    </div>

</header>


<div class="categories">

    <button onclick="filterCategory('All')">All</button>
    <button onclick="filterCategory('Men')">Men</button>
    <button onclick="filterCategory('Women')">Women</button>
    <button onclick="filterCategory('Kids')">Kids</button>
    <button onclick="filterCategory('Groceries')">Groceries</button>
    <button onclick="filterCategory('Accessories')">Accessories</button>

</div>


<section class="products">

    <h2>🛍️ Products</h2>

    <div id="productList"></div>

</section>


<script>

let products = [];
let selectedCategory = "All";


function loadProducts() {

    fetch("ProductDataServlet")

        .then(function(response) {
            return response.json();
        })

        .then(function(data) {

            products = data;

            displayProducts(products);

        })

        .catch(function(error) {

            console.log("Product loading error:", error);

        });
}


function displayProducts(list) {

    let productList = document.getElementById("productList");

    productList.innerHTML = "";


    list.forEach(function(product) {

        let card = document.createElement("div");

        card.className = "product-card";

        card.innerHTML =

            "<h3>" + product.name + "</h3>" +

            "<p>Category: " + product.category + "</p>" +

            "<p>Price: ₹" + product.price + "</p>" +

            "<p>Stock: " + product.stock + "</p>" +

            "<button onclick='addToCart(" + product.id + ")'>" +
            "🛒 Add to Cart" +
            "</button>";


        productList.appendChild(card);

    });
}


function searchProducts() {

    let searchText =
        document.getElementById("searchInput").value.toLowerCase();


    let result = products.filter(function(product) {

        let name =
            String(product.name).toLowerCase();

        let category =
            String(product.category).toLowerCase();


        let matchesSearch =
            name.includes(searchText) ||
            category.includes(searchText);


        let matchesCategory =
            selectedCategory === "All" ||
            product.category === selectedCategory;


        return matchesSearch && matchesCategory;

    });


    displayProducts(result);
}


function filterCategory(category) {

    selectedCategory = category;

    searchProducts();
}


function addToCart(id) {

    let form = document.createElement("form");

    form.method = "POST";

    form.action = "CartServlet";


    let input = document.createElement("input");

    input.type = "hidden";

    input.name = "productId";

    input.value = id;


    form.appendChild(input);

    document.body.appendChild(form);

    form.submit();
}


loadProducts();

</script>

</body>
</html>
