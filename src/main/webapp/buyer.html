<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yoharshini Mart - Buyer</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #212121;
        }

        /* =========================
           HEADER
        ========================= */

        .buyer-header {
            background: #173c33;
            color: white;
            padding: 14px 35px;
            display: flex;
            align-items: center;
            gap: 25px;
            min-height: 70px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .buyer-header h2 {
            margin: 0;
            font-size: 24px;
            white-space: nowrap;
        }

        .search-box {
            flex: 1;
            display: flex;
            max-width: 600px;
            margin: auto;
        }

        .search-box input {
            width: 100%;
            padding: 13px 18px;
            border: none;
            outline: none;
            border-radius: 6px 0 0 6px;
            font-size: 15px;
        }

        .search-box button {
            padding: 13px 22px;
            border: none;
            background: #ff9f00;
            color: white;
            font-weight: bold;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #fb8c00;
        }

        .orders-btn {
            color: white;
            background: #285c4f;
            padding: 11px 17px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            white-space: nowrap;
        }

        .orders-btn:hover {
            background: #367463;
        }

        /* =========================
           CATEGORY SECTION
        ========================= */

        .categories {
            background: white;
            padding: 18px 25px;
            border-bottom: 1px solid #e1e5e8;
            text-align: center;
            overflow-x: auto;
            white-space: nowrap;
        }

        .categories button {
            margin: 5px;
            padding: 10px 20px;
            border: 1px solid #d8dde2;
            border-radius: 22px;
            cursor: pointer;
            background: white;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .categories button:hover {
            background: #173c33;
            color: white;
            border-color: #173c33;
        }

        /* =========================
           PRODUCTS SECTION
        ========================= */

        .products {
            padding: 28px 35px;
            max-width: 1500px;
            margin: auto;
        }

        .products > h2 {
            font-size: 26px;
            margin: 0 0 25px;
            color: #173c33;
        }

        #productList {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        /* =========================
           PRODUCT CARD
        ========================= */

        .product-card {
            background: white;
            border: 1px solid #e2e5e8;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 7px rgba(0,0,0,0.07);
            transition: all 0.25s ease;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 22px rgba(0,0,0,0.14);
        }

        /* =========================
           PRODUCT IMAGE
        ========================= */

        .product-image-box {
            width: 100%;
            height: 245px;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #eeeeee;
        }

        .product-card img {
            width: 100%;
            height: 245px;
            object-fit: contain;
            padding: 12px;
            display: block;
        }

        /* =========================
           PRODUCT INFO
        ========================= */

        .product-info {
            padding: 17px;
        }

        .product-card h3 {
            font-size: 18px;
            color: #212121;
            margin: 0 0 8px;
            line-height: 1.35;
            font-weight: 600;
        }

        .product-description {
            color: #666;
            font-size: 13px;
            margin: 5px 0 10px;
        }

        .category-text {
            color: #777;
            font-size: 13px;
            margin: 5px 0;
        }

        /* =========================
           RATING
        ========================= */

        .rating {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 9px 0;
        }

        .stars {
            color: #f5a623;
            font-size: 17px;
            letter-spacing: 1px;
        }

        .rating-number {
            background: #173c33;
            color: white;
            font-size: 12px;
            padding: 4px 7px;
            border-radius: 4px;
            font-weight: bold;
        }

        .rating-text {
            color: #777;
            font-size: 12px;
        }

        /* =========================
           PRICE
        ========================= */

        .price {
            color: #212121;
            font-size: 23px;
            font-weight: 700;
            margin: 10px 0 6px;
        }

        .price-label {
            font-size: 12px;
            color: #777;
            font-weight: normal;
        }

        /* =========================
           STOCK
        ========================= */

        .stock {
            font-size: 13px;
            color: #188038;
            font-weight: 600;
            margin: 7px 0;
        }

        /* =========================
           ADD TO CART
        ========================= */

        .product-card button {
            width: 100%;
            background: #ff9f00;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.2s;
        }

        .product-card button:hover {
            background: #fb8c00;
        }

        /* =========================
           EMPTY PRODUCTS
        ========================= */

        .empty-products {
            grid-column: 1 / -1;
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 12px;
            color: #777;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1200px) {

            #productList {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 850px) {

            .buyer-header {
                flex-wrap: wrap;
                padding: 15px;
            }

            .buyer-header h2 {
                width: 100%;
            }

            .search-box {
                order: 3;
                width: 100%;
                max-width: none;
            }

            #productList {
                grid-template-columns: repeat(2, 1fr);
            }

            .products {
                padding: 20px;
            }
        }

        @media (max-width: 550px) {

            #productList {
                grid-template-columns: 1fr;
            }

            .categories {
                text-align: left;
            }

            .product-image-box,
            .product-card img {
                height: 280px;
            }
        }
        /* Buyer Page Font Sizes */

/* Website heading */
.buyer-header h2 {
    font-size: 26px;
}

/* Category buttons */
.categories button {
    font-size: 15px;
}

/* Products heading */
.products > h2 {
    font-size: 28px;
}

/* Product name */
.product-card h3 {
    font-size: 20px;
}

/* Category and stock details */
.category-text,
.stock {
    font-size: 14px;
}

/* Product price */
.price {
    font-size: 24px;
}

/* Star rating */
.stars {
    font-size: 19px;
}

/* Add to Cart button */
.product-card button {
    font-size: 16px;
}

/* Search box */
.search-box input {
    font-size: 16px;
}
/* FORCE BUYER PAGE FONT SIZES */

.buyer-header h2 {
    font-size: 30px !important;
}

.categories button {
    font-size: 18px !important;
}

.products > h2 {
    font-size: 32px !important;
}

.product-card h3 {
    font-size: 24px !important;
}

.product-card .category-text,
.product-card .stock {
    font-size: 17px !important;
}

.product-card .price {
    font-size: 28px !important;
}

.product-card .stars {
    font-size: 22px !important;
}

.product-card button {
    font-size: 19px !important;
}

.search-box input,
.search-box button {
    font-size: 18px !important;
}
/* ===== CLEAR AND BIGGER PRODUCT DETAILS ===== */

/* Product name */
.product-card h3 {
    font-size: 25px !important;
    font-weight: 700 !important;
    line-height: 1.5 !important;
    margin-bottom: 14px !important;
}

/* Category and subcategory */
.product-card .category-text {
    font-size: 18px !important;
    font-weight: 500 !important;
    line-height: 1.6 !important;
    color: #444 !important;
}

/* Star rating */
.product-card .rating {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 0 !important;
}

.product-card .stars {
    font-size: 25px !important;
    letter-spacing: 2px !important;
}

.product-card .rating-number {
    font-size: 16px !important;
    padding: 6px 9px !important;
}

.product-card .rating-text {
    font-size: 16px !important;
    color: #555 !important;
}

/* Product price */
.product-card .price {
    font-size: 29px !important;
    font-weight: 700 !important;
    margin: 14px 0 8px !important;
}

/* Inclusive of all taxes */
.product-card .price-label {
    font-size: 16px !important;
    color: #555 !important;
    margin-bottom: 12px !important;
}

/* Available stock */
.product-card .stock {
    font-size: 18px !important;
    font-weight: 600 !important;
    line-height: 1.6 !important;
    margin: 12px 0 !important;
}

/* Add to Cart button */
.product-card button {
    font-size: 19px !important;
    font-weight: 700 !important;
    padding: 15px !important;
}

    </style>

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header class="buyer-header">

    <h2>🛍️ Yoharshini Mart</h2>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search for products, brands and more..."
            onkeyup="searchProducts()"
        >

        <button onclick="searchProducts()">
            🔍 Search
        </button>

    </div>

    <a
        href="BuyerOrderHistoryServlet"
        class="orders-btn"
    >
        📦 My Orders
    </a>

</header>


<!-- =========================
     CATEGORY FILTERS
========================= -->

<div class="categories">

    <button onclick="filterCategory('All')">
        All
    </button>

    <button onclick="filterCategory('Electronics')">
        Electronics
    </button>

    <button onclick="filterCategory('Fashion')">
        Fashion
    </button>

    <button onclick="filterCategory('Groceries')">
        Groceries
    </button>

    <button onclick="filterCategory('Home & Kitchen')">
        Home & Kitchen
    </button>

    <button onclick="filterCategory('Beauty & Personal Care')">
        Beauty
    </button>

    <button onclick="filterCategory('Sports & Fitness')">
        Sports
    </button>

    <button onclick="filterCategory('Books')">
        Books
    </button>

    <button onclick="filterCategory('Toys & Games')">
        Toys & Games
    </button>

    <button onclick="filterCategory('Baby Products')">
        Baby Products
    </button>

    <button onclick="filterCategory('Automotive')">
        Automotive
    </button>

    <button onclick="filterCategory('Footwear')">
        Footwear
    </button>

    <button onclick="filterCategory('Jewellery & Accessories')">
        Jewellery
    </button>

    <button onclick="filterCategory('Pet Supplies')">
        Pet Supplies
    </button>

    <button onclick="filterCategory('Men')">
        Men
    </button>

    <button onclick="filterCategory('Women')">
        Women
    </button>

    <button onclick="filterCategory('Kids')">
        Kids
    </button>

</div>


<!-- =========================
     PRODUCTS
========================= -->

<section class="products">

    <h2>🛍️ Products</h2>

    <div id="productList"></div>

</section>


<script>

let products = [];

let productRatings = {};

let selectedCategory = "All";
function loadProductRatings() {

    fetch("ProductRatingServlet")
        .then(function(response) {

            if (!response.ok) {
                throw new Error("Unable to load ratings");
            }

            return response.json();

        })
        .then(function(data) {

            productRatings = data;

            displayProducts(
                products.filter(function(product) {

                    let searchText =
                        document.getElementById("searchInput")
                            .value.toLowerCase();

                    let matchesSearch =
                        String(product.name).toLowerCase()
                            .includes(searchText) ||
                        String(product.category).toLowerCase()
                            .includes(searchText) ||
                        String(product.subCategory).toLowerCase()
                            .includes(searchText);

                    let matchesCategory =
                        selectedCategory === "All" ||
                        product.category === selectedCategory;

                    return matchesSearch && matchesCategory;

                })
            );

        })
        .catch(function(error) {

            console.error("Rating loading error:", error);

        });
}


/* =========================
   LOAD PRODUCTS
========================= */

function loadProducts() {

    fetch("ProductDataServlet")

        .then(function(response) {

            return response.json();

        })

        .then(function(data) {

            products = data;

            displayProducts(products);

        })

        .catch(function(error) {

            console.log(
                "Product loading error:",
                error
            );

        });

}


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts(list) {

    let productList =
        document.getElementById("productList");

    productList.innerHTML = "";


    if (list.length === 0) {

        productList.innerHTML =

            "<div class='empty-products'>" +

            "<h2>😔 No Products Found</h2>" +

            "<p>Try another search or category.</p>" +

            "</div>";

        return;
    }


    list.forEach(function(product) {

        let card =
            document.createElement("div");

        card.className = "product-card";


        let imageHTML = "";

        if (product.imageUrl) {

            imageHTML =

                "<div class='product-image-box'>" +

                "<a href='ProductDetailsServlet?id=" + product.id +
"' style='display:block;width:100%;height:100%;'>" +

"<img src='" +
product.imageUrl +
"' alt='" +
product.name +
"'>" +

"</a>" +

                "</div>";

        } else {

            imageHTML =

                "<div class='product-image-box'>" +

                "<div style='font-size:60px;'>📦</div>" +

                "</div>";
        }


        card.innerHTML =

            imageHTML +


            "<div class='product-info'>" +


            
            "<h3>" +
"<a href='ProductDetailsServlet?id=" + product.id +
"' style='color:inherit;text-decoration:none;'>" +
product.name +
"</a></h3>" +

            "<p class='category-text'>" +
            "📂 " +
            product.category +
            " • " +
            product.subCategory +
            "</p>" +


            /*
             * Rating display.
             * This is visual until real review
             * data is connected to the product.
             */

            "<div class='rating'>" +

"<span class='stars'>" +
(
    productRatings[product.id]
        ? "★".repeat(Math.round(productRatings[product.id].averageRating)) +
          "☆".repeat(5 - Math.round(productRatings[product.id].averageRating))
        : "☆☆☆☆☆"
) +
"</span>" +

"<span class='rating-number'>" +
(
    productRatings[product.id]
        ? productRatings[product.id].averageRating + " ★"
        : "No ratings"
) +
"</span>" +

"<span class='rating-text'>" +
(
    productRatings[product.id]
        ? "(" + productRatings[product.id].totalReviews + " reviews)"
        : "(0 reviews)"
) +
"</span>" +

"</div>" +


            "<div class='price'>" +

            "₹" +
            Number(product.price)
                .toLocaleString("en-IN") +

            "</div>" +


            "<div class='price-label'>" +
            "Inclusive of all taxes" +
            "</div>" +


            "<p class='stock'>" +
            "✓ Available Stock: " +
            product.stock +
            "</p>" +


            "<button onclick='addToCart(" +
            product.id +
            ")'>" +

            "🛒 Add to Cart" +

            "</button>" +


            "</div>";


        productList.appendChild(card);

    });

}


/* =========================
   SEARCH PRODUCTS
========================= */

function searchProducts() {

    let searchText =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();


    let result =
        products.filter(function(product) {


            let name =
                String(product.name)
                .toLowerCase();


            let category =
                String(product.category)
                .toLowerCase();


            let subCategory =
                String(product.subCategory)
                .toLowerCase();


            let matchesSearch =

                name.includes(searchText) ||

                category.includes(searchText) ||

                subCategory.includes(searchText);


            let matchesCategory =

                selectedCategory === "All" ||

                product.category === selectedCategory;


            return (
                matchesSearch &&
                matchesCategory
            );

        });


    displayProducts(result);

}


/* =========================
   CATEGORY FILTER
========================= */

function filterCategory(category) {

    selectedCategory = category;

    searchProducts();

}


/* =========================
   ADD TO CART
========================= */

function addToCart(Id) {

    const formData =
        new URLSearchParams();

    formData.append(
        "productId",
        Id
    );


    fetch("CartServlet", {

        method: "POST",

        headers: {

            "Content-Type":
                "application/x-www-form-urlencoded"

        },

        body:
            formData.toString()

    })

    .then(function(response) {

        return response.text();

    })

    .then(function(result) {

        window.location.href =
            "CartViewServlet";

    })

    .catch(function(error) {

        console.error(
            "Add to Cart Error:",
            error
        );

        alert(
            "Unable to add product to cart."
        );

    });

}


/* =========================
   START
========================= */

loadProducts();
loadProductRatings();

</script>
<!-- Basic Chatbot -->
<div id="chatbot">
    <button id="chatToggle" onclick="toggleChat()">💬 Chat with us</button>

    <div id="chatWindow" style="display:none;">
        <div class="chat-header">
            Yoharshini Mart Assistant
            <button onclick="toggleChat()">✖</button>
        </div>

        <div id="chatMessages">
            <p class="bot">
                Hello! Welcome to Yoharshini Mart.
                How can I help you?
            </p>
        </div>

        <div class="chat-input">
            <input type="text" id="userMessage"
                   placeholder="Type your message..."
                   onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<style>
#chatbot {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 9999;
    font-family: Arial, sans-serif;
}

#chatToggle {
    background: #173c33;
    color: white;
    border: none;
    border-radius: 25px;
    padding: 13px 18px;
    cursor: pointer;
}

#chatWindow {
    width: 300px;
    height: 380px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px #0002;
    margin-bottom: 10px;
}

.chat-header {
    background: #173c33;
    color: white;
    padding: 14px;
    display: flex;
    justify-content: space-between;
}

.chat-header button {
    background: transparent;
    color: white;
    border: none;
    cursor: pointer;
}

#chatMessages {
    height: 265px;
    padding: 10px;
    overflow-y: auto;
}

.bot, .user {
    padding: 9px;
    border-radius: 10px;
    max-width: 85%;
    overflow-wrap: anywhere;
}

.bot {
    background: #edf4ef;
}

.user {
    background: #d8eadf;
    margin-left: auto;
}

.chat-input {
    display: flex;
    padding: 8px;
    gap: 5px;
}

.chat-input input {
    width: 70%;
    min-width: 0;
    padding: 8px;
}

.chat-input button {
    background: #173c33;
    color: white;
    border: none;
    padding: 8px;
    cursor: pointer;
}
</style>

<script>
function toggleChat() {
    const chat = document.getElementById("chatWindow");

    chat.style.display =
        chat.style.display === "none" ? "block" : "none";
}

function sendMessage() {
    const input = document.getElementById("userMessage");
    const message = input.value.trim();

    if (message === "") return;

    const messages = document.getElementById("chatMessages");

    const userText = document.createElement("p");
    userText.className = "user";
    userText.textContent = message;
    messages.appendChild(userText);

    const text = message.toLowerCase();
    let reply = "";

    if (text.includes("hello") || text.includes("hi")) {
        reply = "Hello! How can I help you today?";
    } else if (text.includes("product") || text.includes("search")) {
        reply = "You can browse products and use the search bar to find items.";
    } else if (text.includes("cart")) {
        reply = "Open your shopping cart to view items and update quantities.";
    } else if (text.includes("order") || text.includes("track")) {
        reply = "Open My Orders to check your order history and current status.";
    } else if (text.includes("return") || text.includes("cancel")) {
        reply = "Please check your order details or contact the seller for assistance.";
    } else if (text.includes("payment")) {
        reply = "Follow the checkout instructions shown on the website.";
    } else if (text.includes("thank")) {
        reply = "You're welcome! Thank you for shopping with us.";
    } else if (text.includes("help")) {
        reply = "I can help with products, cart, orders, tracking and checkout.";
    } else {
        reply = "Sorry, I don't understand that yet. Try asking about products, cart, orders or checkout.";
    }

    const botText = document.createElement("p");
    botText.className = "bot";
    botText.textContent = reply;
    messages.appendChild(botText);

    input.value = "";
    messages.scrollTop = messages.scrollHeight;
}
</script>



</body>
</html>
