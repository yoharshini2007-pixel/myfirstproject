<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - Yoharshinimart</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .form-card {
            max-width: 400px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header style="display: flex; justify-content: space-between;
               align-items: center; background-color: #333;
               color: white; padding: 10px 20px;">

    <h2>Seller Dashboard</h2>

    <a href="home.html"
       style="color: white; text-decoration: none;">
        ← Back to Home
    </a>

</header>

<div class="form-card">

    <h3>Add New Product</h3>

    <form action="AddProductServlet" method="post">

        <div class="form-group">
            <label>Seller ID:</label>
            <input type="number" name="seller_id" required>
        </div>

        <div class="form-group">
            <label>Product Name:</label>
            <input type="text"
                   name="pname"
                   placeholder="E.g., Rice, Shirt"
                   required>
        </div>

        <div class="form-group">
            <label>Description:</label>
            <textarea name="pdescription"
                      placeholder="Enter product description"
                      required></textarea>
        </div>

        <div class="form-group">
            <label>Category:</label>

            <select name="pcategory" required>
                <option value="Groceries">Groceries</option>
                <option value="Fashion">Fashion</option>
                <option value="Electronics">Electronics</option>
            </select>
        </div>

        <div class="form-group">
            <label>Price (₹):</label>

            <input type="number"
                   name="pprice"
                   placeholder="E.g., 500"
                   step="0.01"
                   required>
        </div>

        <div class="form-group">
            <label>Stock Quantity:</label>

            <input type="number"
                   name="pstock"
                   placeholder="E.g., 10"
                   min="1"
                   required>
        </div>

        <button type="submit" class="btn-submit">
            Add Product
        </button>

    </form>

</div>

</body>
</html>
