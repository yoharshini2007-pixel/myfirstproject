<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoharshini Mart - Shopping Cart</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
body { background: #f7f8f5; color: #173c33; font-size: 18px; padding: 30px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
.header h2 { font-size: 28px; }
.btn { padding: 10px 20px; background: #173c33; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
.cart-container { background: white; padding: 30px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); max-width: 800px; margin: 0 auto; }
.cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 15px 0; }
.cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
.summary { margin-top: 20px; font-size: 20px; font-weight: bold; text-align: right; }
.checkout-btn { width: 100%; padding: 15px; background: #28584c; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
.checkout-btn:hover { background: #173c33; }
</style>
</head>
<body>

<div class="header">
    <h2>🛒 Your Shopping Cart</h2>
    <a href="buyer.html" class="btn">Continue Shopping</a>
</div>

<div class="cart-container" id="cartContainer">
    <!-- Cart items will load here -->
</div>

<script>
function loadCart() {
    let cartContainer = document.getElementById("cartContainer");
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length === 0) {
        cartContainer.innerHTML = `
            <div style="text-align: center; padding: 40px;">
                <h3>Your cart is empty</h3>
                <p style="color: #666; margin: 10px 0;">Add products to your cart before placing an order.</p>
                <a href="buyer.html" class="btn" style="display: inline-block; margin-top: 15px;">Continue Shopping</a>
            </div>
        `;
        return;
    }

    let html = "";
    let total = 0;

    cart.forEach((item, index) => {
        let itemTotal = item.price * (item.quantity || 1);
        total += itemTotal;
        html += `
            <div class="cart-item">
                <img src="${item.image}" alt="${item.name}">
                <div>
                    <h3>${item.name}</h3>
                    <p>Price: ₹${item.price} x ${item.quantity || 1}</p>
                </div>
                <p><b>₹${itemTotal}</b></p>
                <button onclick="removeItem(${index})" style="background: #d9534f; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer;">Remove</button>
            </div>
        `;
    });

    html += `
        <div class="summary">Total Amount: ₹${total}</div>
        <button class="checkout-btn" onclick="confirmOrder()">Confirm Order</button>
    `;

    cartContainer.innerHTML = html;
}

function removeItem(index) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
}

function confirmOrder() {
    alert("Order placed successfully! 🎉 Thank you for shopping with Yoharshini Mart.");
    localStorage.removeItem("cart");
    window.location.href = "buyer.html";
}

window.onload = loadCart;
</script>

</body>
</html>
