<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoharshinimart - Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>🛒 Yoharshinimart - Shopping Cart</h1>
        </div>
        <nav>
            <a href="home.html">← Back to Home</a>
        </nav>
    </header>

    <main style="padding: 20px; max-width: 800px; margin: 0 auto;">
        <h2>Your Cart Items</h2>
        
        <div id="cart-container" style="margin-top: 20px;">
            <!-- Cart items will display here dynamically -->
        </div>

        <div style="margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 5px;">
            <h3 id="total-price">Total Amount: ₹0</h3>
            <button onclick="placeOrder()" style="padding: 10px 20px; font-size: 16px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px;">Confirm Order (Checkout)</button>
        </div>
    </main>
    

    
</body>
</html>
<script>

function loadCart() {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let container = document.getElementById("cart-container");

    let total = 0;

    container.innerHTML = "";

    if (cart.length === 0) {

        container.innerHTML =
            "<p>Your cart is empty! Go back to home to add items.</p>";

        document.getElementById("total-price").innerText =
            "Total Amount: ₹0";

        return;
    }

    cart.forEach(function(item, index) {

        let price = Number(item.price) || 0;

        total = total + price;

        container.innerHTML += `
            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                background:white;
                padding:15px;
                margin-bottom:10px;
                border-radius:5px;
                border:1px solid #ddd;
            ">

                <div>
                    <h4 style="margin:0;">
                        ${item.name}
                    </h4>

                    <p style="margin:5px 0 0 0;color:#555;">
                        Price: ₹${price}
                    </p>
                </div>

                <button
                    onclick="removeItem(${index})"
                    style="
                    padding:5px 10px;
                    background-color:#dc3545;
                    color:white;
                    border:none;
                    border-radius:3px;
                    cursor:pointer;
                    ">
                    Remove
                </button>

            </div>
        `;
    });

    document.getElementById("total-price").innerText =
        "Total Amount: ₹" + total;
}


function removeItem(index) {

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    cart.splice(index, 1);

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    loadCart();
}


function placeOrder() {

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length === 0) {

        alert(
            "Your cart is empty! Add items before placing an order."
        );

        return;
    }

    let orders =
        JSON.parse(
            localStorage.getItem("yoharshiniOrders")
        ) || [];

    let total = 0;

    cart.forEach(function(item) {

        total = total + (Number(item.price) || 0);

    });

    let order = {

        id: Date.now(),

        items: cart,

        total: total,

        status: "Pending",

        date: new Date().toLocaleDateString()

    };

    orders.push(order);

    localStorage.setItem(
        "yoharshiniOrders",
        JSON.stringify(orders)
    );

    localStorage.removeItem("cart");

    alert("Order Placed Successfully! 🎉");

    window.location.href = "home.html";
}


window.onload = loadCart;

</script>
